name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ny push på samma PR avbryter den gamla körningen (sparar minuter). Gruppnyckeln är PR-numret, och för pushar commit-sha:n.
# En main-push får därmed en egen grupp och kan varken avbrytas eller ersättas som köad körning av en senare commit
# (en väntande körning i samma grupp ersätts av en nyare även utan cancel-in-progress), så varje main-commit får sin kontroll.
# Inga paths-ignore: required checks (branch protection) skulle då stå som pending för alltid på PR:er som bara rör docs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build --workspace=@runquest/backend
        working-directory: .

      - name: Run tests
        run: npm test

  shared:
    name: Shared — tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest transpilerar utan att typkontrollera: typfel i kontrakten skulle annars bara synas i konsumenternas tsc.
      - name: Typecheck
        run: npx tsc --noEmit -p packages/shared

      - name: Run tests
        run: npm test -w packages/shared

  frontend:
    name: Frontend — build, typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Versionsvakt (docs/dokumentation.md): package.json (rot + frontend), översta rubriken i CHANGELOG.md
      # och changelog.json ska hänga ihop. Inga beroenden, så den kör först och felar snabbt.
      - name: Version guard
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs
        working-directory: .

      # Repo-vakter (RUN-221): inget workspace med test-skript får sakna testfiler, och varje TODO/FIXME
      # i apps/* och packages/* måste bära en RUN-nyckel. Inga beroenden, så de kör före npm ci.
      - name: Repo guards
        run: |
          node scripts/ci-guards.mjs
          node --test scripts/ci-guards.test.mjs
        working-directory: .

      # Byggstegets Sentry-inställningar (RUN-285): releasenamnet och att uppladdningen bara finns med token. Inga beroenden, inget nätverk.
      - name: Sentry build settings
        run: node --test scripts/sentry-build.test.mjs
        working-directory: .

      # E2E-vakten (RUN-290): Playwright-sviten får bara köras mot staging eller localhost. Rena funktioner, inget nätverk, inga beroenden.
      - name: E2E target guard
        run: node --test scripts/e2e-guard.test.mjs
        working-directory: .

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # Repo-rotens Caddyfile serverar frontend på Railway; fel här ger vit sida i prod.
      - name: Static serving (Caddy)
        run: bash scripts/verify-static-serving.sh
        working-directory: .

      # Blockerande sedan 2026-10-04: typskulden betalades i Fas 2 (ADR 001),
      # 0 fel/0 varningar är baslinjen och får inte regressa.
      - name: Typecheck
        run: npx tsc -b

      # E2E-sviten (apps/e2e) körs aldrig här: den går mot staging i e2e-staging.yml. Men dess kod ska kompilera och listas även i PR-flödet, annars
      # märks ett fel först på nattkörningen. Ingen webbläsare och inget nätverk; adresserna är localhost, som vakten tillåter.
      - name: E2E suite (typecheck and listing)
        run: |
          npx tsc --noEmit -p apps/e2e
          npm run test:e2e:list --workspace=@runquest/e2e
        working-directory: .
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:3001

      - name: Lint
        run: npx eslint . --max-warnings 0

      # Designspråkets CSS-regler (RUN-223): px/hex/rgb(a), hörn, typografi ur tokens, lager och rörelse. Reglerna bor i stylelint.config.js;
      # temafilernas synk prövar src/test/themeTokens.sync.test.ts i teststeget.
      - name: Stylelint
        run: npm run lint:css

      # Blockerande från start: ny frontendkod kräver tester (ADR 001).
      - name: Test
        run: npm test
