name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build --workspace=@runquest/backend
        working-directory: .

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — build, typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # tsc -b kör den riktiga typechecken (tidigare körde CI tsc --noEmit mot
      # en tsconfig med "files": [] — den kontrollerade ingenting). ~98 kända
      # typfel finns; steget är icke-blockerande tills skulden är betald (Fas 2),
      # men felen syns i varje körning. Samma sak för lint (15 fel, 22 varningar).
      - name: Typecheck (non-blocking — känd skuld)
        run: npx tsc -b
        continue-on-error: true

      - name: Lint (non-blocking — känd skuld)
        run: npx eslint .
        continue-on-error: true
