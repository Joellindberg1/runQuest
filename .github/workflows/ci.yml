name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ny push på samma PR avbryter den gamla körningen (sparar minuter). Pushar till main avbryts aldrig,
# så varje main-commit får sin kontroll. Inga paths-ignore: required checks (branch protection) skulle då
# stå som pending för alltid på PR:er som bara rör docs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build --workspace=@runquest/backend
        working-directory: .

      - name: Run tests
        run: npm test

  shared:
    name: Shared — tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -w packages/shared

  frontend:
    name: Frontend — build, typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Versionsvakt (docs/dokumentation.md): package.json (rot + frontend), översta rubriken i CHANGELOG.md
      # och changelog.json ska hänga ihop. Inga beroenden, så den kör först och felar snabbt.
      - name: Version guard
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs
        working-directory: .

      # Repo-vakter (RUN-221): inget workspace med test-skript får sakna testfiler, och varje TODO/FIXME
      # i apps/* och packages/* måste bära en RUN-nyckel. Inga beroenden, så de kör före npm ci.
      - name: Repo guards
        run: |
          node scripts/ci-guards.mjs
          node --test scripts/ci-guards.test.mjs
        working-directory: .

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # Repo-rotens Caddyfile serverar frontend på Railway; fel här ger vit sida i prod.
      - name: Static serving (Caddy)
        run: bash scripts/verify-static-serving.sh
        working-directory: .

      # Blockerande sedan 2026-10-04: typskulden betalades i Fas 2 (ADR 001),
      # 0 fel/0 varningar är baslinjen och får inte regressa.
      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --max-warnings 0

      # Blockerande från start: ny frontendkod kräver tester (ADR 001).
      - name: Test
        run: npm test
