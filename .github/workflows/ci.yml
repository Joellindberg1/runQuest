name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ny push på samma PR avbryter den gamla körningen (sparar minuter). Gruppnyckeln är PR-numret, och för pushar commit-sha:n.
# En main-push får därmed en egen grupp och kan varken avbrytas eller ersättas som köad körning av en senare commit
# (en väntande körning i samma grupp ersätts av en nyare även utan cancel-in-progress), så varje main-commit får sin kontroll.
# Inga paths-ignore: required checks (branch protection) skulle då stå som pending för alltid på PR:er som bara rör docs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      # Testet som jämför frontendens fejkade news-server med de riktiga rutterna importerar frontendens fixturer; vitest typkontrollerar inte.
      - name: Typecheck (tests that import across packages)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Build
        run: npm run build --workspace=@runquest/backend
        working-directory: .

      - name: Run tests
        run: npm test

  shared:
    name: Shared — tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest transpilerar utan att typkontrollera: typfel i kontrakten skulle annars bara synas i konsumenternas tsc.
      - name: Typecheck
        run: npx tsc --noEmit -p packages/shared

      - name: Run tests
        run: npm test -w packages/shared

      # Release-PR:n (integration/* eller release/* mot main) får inte släppa integritetstexten med en ägarplatshållare kvar (RUN-293).
      - name: Release check (data policy placeholders)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'integration/') || startsWith(github.head_ref, 'release/'))
        run: npm test -w packages/shared -- dataPolicy
        env:
          RUNQUEST_RELEASE_CHECK: '1'

  frontend:
    name: Frontend — build, typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Versionsvakt (docs/dokumentation.md): package.json (rot + frontend), översta rubriken i CHANGELOG.md
      # och changelog.json ska hänga ihop. Inga beroenden, så den kör först och felar snabbt.
      - name: Version guard
        run: |
          node scripts/check-versions.mjs
          node --test scripts/check-versions.test.mjs
        working-directory: .

      # Repo-vakter (RUN-221): inget workspace med test-skript får sakna testfiler, och varje TODO/FIXME
      # i apps/* och packages/* måste bära en RUN-nyckel. Inga beroenden, så de kör före npm ci.
      - name: Repo guards
        run: |
          node scripts/ci-guards.mjs
          node --test scripts/ci-guards.test.mjs
        working-directory: .

      # Byggstegets Sentry-inställningar (RUN-285): releasenamnet och att uppladdningen bara finns med token. Inga beroenden, inget nätverk.
      - name: Sentry build settings
        run: node --test scripts/sentry-build.test.mjs
        working-directory: .

      # CSP-vakten (RUN-344): logiken som prövar Caddyfilens inline-hashar mot bygget. Själva prövningen mot dist körs i "Static serving (Caddy)" nedan.
      - name: CSP guard
        run: node --test scripts/csp-hashes.test.mjs
        working-directory: .

      # Återställningsövningens jämförelse-SQL (docs/runbook-backup-compare.sql) körs av ägaren mot prod: filen får bara innehålla
      # SELECT. Inga beroenden, inget nätverk.
      - name: Backup runbook SQL guard
        run: node --test scripts/runbook-backup-sql.test.mjs
        working-directory: .

      # Lasttestets skript (RUN-289): vakten på bas-URL:en (bara staging och localhost), rutt-listan (aldrig Strava), budgetar och städning,
      # prövade mot en fejkserver på 127.0.0.1. Själva lasttestet körs aldrig i CI; run.mjs vägrar när CI är satt.
      - name: Loadtest script
        run: node --test scripts/loadtest/*.test.mjs
        working-directory: .

      # Lighthouse-verktygen (RUN-259): det falska API:et, felraderna, skriptets vakter och att budgeten i lighthouserc.json är fäst
      # (en lättad gräns fäller). Prövar inte själva Lighthouse-mätningen, den körs i jobbet "Lighthouse". Inga beroenden, före npm ci.
      - name: Lighthouse tooling
        run: node --test scripts/lighthouse-ci.test.mjs
        working-directory: .

      # E2E-vakten (RUN-290): Playwright-sviten får bara köras mot staging eller localhost. Rena funktioner, inget nätverk, inga beroenden.
      - name: E2E target guard
        run: node --test scripts/e2e-guard.test.mjs
        working-directory: .

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # Repo-rotens Caddyfile serverar frontend på Railway; fel här ger vit sida i prod.
      - name: Static serving (Caddy)
        run: bash scripts/verify-static-serving.sh
        working-directory: .

      # Blockerande sedan 2026-10-04: typskulden betalades i Fas 2 (ADR 001),
      # 0 fel/0 varningar är baslinjen och får inte regressa.
      - name: Typecheck
        run: npx tsc -b

      # E2E-sviten (apps/e2e) körs aldrig här: den går mot staging i e2e-staging.yml. Men dess kod ska kompilera och listas även i PR-flödet, annars
      # märks ett fel först på nattkörningen. Ingen webbläsare och inget nätverk; adresserna är localhost, som vakten tillåter.
      - name: E2E suite (typecheck and listing)
        run: |
          npx tsc --noEmit -p apps/e2e
          npm run test:e2e:list --workspace=@runquest/e2e
        working-directory: .
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:3001

      - name: Lint
        run: npx eslint . --max-warnings 0

      # Designspråkets CSS-regler (RUN-223): px/hex/rgb(a), hörn, typografi ur tokens, lager och rörelse. Reglerna bor i stylelint.config.js;
      # temafilernas synk prövar src/test/themeTokens.sync.test.ts i teststeget.
      - name: Stylelint
        run: npm run lint:css

      # Blockerande från start: ny frontendkod kräver tester (ADR 001).
      - name: Test
        run: npm test

  # Prestandabudget för de publika sidorna (RUN-259): Lighthouse mobil mot det byggda dist/, serverat av samma Caddy som
  # verify-static-serving.sh. Eget jobb, parallellt med de andra: de andra jobbens installation och cache berörs inte
  # (Lighthouse-verktyget har ett eget beroendeträd i scripts/lighthouse). Mätningen går bara mot 127.0.0.1; ingen prod,
  # ingen Railway, ingen extern rapporttjänst. Budget och rutin: docs/release.md ("Lighthouse-budget").
  lighthouse:
    name: Lighthouse — prestandabudget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Icke-blockerande första veckan (RUN-259): budgetbrott syns som orange steg och i artefakten men fäller inte PR:en.
      # Slå om till 'true' för att göra budgeten blockerande (och lägg jobbet bland required checks). Se docs/release.md.
      LIGHTHOUSE_BLOCKING: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/lighthouse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Install Lighthouse CI
        run: npm ci
        working-directory: scripts/lighthouse

      # Enda steget som hämtar något utifrån: Caddy från GitHub Releases, med kontrollsumma (samma version som verify-static-serving.sh).
      - name: Install Caddy
        run: echo "CADDY_BIN=$(bash scripts/lighthouse/install-caddy.sh "$RUNNER_TEMP/caddy" | tail -n 1)" >> "$GITHUB_ENV"

      # Sidan ska klara båda: utan svar från API:et (anslutningsfel, bygget pekar på localhost:3001 där inget lyssnar) och med ett falskt svar.
      - name: Lighthouse (API ger fel)
        id: lighthouse-error
        continue-on-error: ${{ env.LIGHTHOUSE_BLOCKING != 'true' }}
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          export CHROME_PATH
          STATS_MODE=error bash scripts/lighthouse/run.sh

      - name: Lighthouse (falskt API)
        id: lighthouse-mock
        if: ${{ !cancelled() }}
        continue-on-error: ${{ env.LIGHTHOUSE_BLOCKING != 'true' }}
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          export CHROME_PATH
          STATS_MODE=mock bash scripts/lighthouse/run.sh

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: warn
