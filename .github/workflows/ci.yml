name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build --workspace=@runquest/backend
        working-directory: .

      - name: Run tests
        run: npm test

  shared:
    name: Shared — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -w packages/shared

  frontend:
    name: Frontend — build, typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # Repo-rotens Caddyfile serverar frontend på Railway; fel här ger vit sida i prod.
      - name: Static serving (Caddy)
        run: bash scripts/verify-static-serving.sh
        working-directory: .

      # Blockerande sedan 2026-10-04: typskulden betalades i Fas 2 (ADR 001),
      # 0 fel/0 varningar är baslinjen och får inte regressa.
      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx eslint . --max-warnings 0

      # Blockerande från start: ny frontendkod kräver tester (ADR 001).
      - name: Test
        run: npm test
